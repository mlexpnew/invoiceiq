name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm:
        description: "Also score the held-out layout with an LLM fallback (groq, gemini or blank)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api,app]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Benchmark (fails if any score drops below 95% on the dev layouts)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM: ${{ inputs.llm }}
        run: |
          set +e
          python -m invoiceiq.evaluate --n 160 --gate ${LLM:+--llm "$LLM"}
          code=$?
          cat eval_results/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: eval_results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test the API image
        run: |
          docker build -t invoiceiq .
          docker run -d -p 8000:8000 --name api invoiceiq
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
