[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceiq"
version = "1.0.0"
description = "GST purchase invoice checks and GSTR-2B reconciliation for Indian finance teams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chandini Pradhan" }]
dependencies = [
  "pdfplumber>=0.11",
  "pydantic>=2.6",
  "openpyxl>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5", "reportlab>=4.0", "httpx>=0.27"]

[project.scripts]
invoiceiq = "invoiceiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File()/Form()/Depends() defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["invoiceiq", "conftest"]
